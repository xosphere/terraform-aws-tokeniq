name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only check out and validate; the token needs nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (root)
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (examples)
        run: |
          for dir in examples/*/; do
            [ -d "$dir" ] || continue
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # TIQ-409: customers run this module with OpenTofu too (the first one through Scalr), so
  # validate it there as well. The module isn't on registry.opentofu.org, which is why
  # consumers should write source = "registry.terraform.io/xosphere/tokeniq/aws" (README).
  opentofu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tofu: ["1.12.12", "1.13.9"]
    steps:
      - uses: actions/checkout@v4

      # Installed from the release and checked against its published SHA256SUMS: the org's
      # Actions allow-list (iac-terraform mgmt/github) doesn't include opentofu/setup-opentofu,
      # and a disallowed action fails the whole workflow at startup.
      - name: Install OpenTofu
        env:
          TOFU_VERSION: ${{ matrix.tofu }}
        run: |
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          zip="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "$base/$zip"
          curl -fsSLo "$RUNNER_TEMP/SHA256SUMS" "$base/tofu_${TOFU_VERSION}_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " ${zip}$" SHA256SUMS | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/tofu"
          unzip -q "$RUNNER_TEMP/$zip" tofu -d "$RUNNER_TEMP/tofu"
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tofu/tofu" version

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu validate (root)
        run: |
          tofu init -backend=false -input=false
          tofu validate

      - name: tofu validate (examples)
        run: |
          for dir in examples/*/; do
            [ -d "$dir" ] || continue
            echo "==> $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
          done
